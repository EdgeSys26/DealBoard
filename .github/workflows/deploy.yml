# Production deploy to Vercel project deal-board (tawny)
name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_GrzLpml2mM6HWMirGDsu3VaA
      VERCEL_PROJECT_ID: prj_EvEoNu34E9qiXaXRzOhI3b4Dy2Da
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Upsert DATABASE_URL on Vercel project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: https://nfvbthiihrjpkumzgtxb.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mdmJ0aGlpaHJqcGt1bXpndHhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMzA4NjIsImV4cCI6MjEwMzcwNjg2Mn0.u_k9rOyb7rktHxnWtfumHbVK9Gg2ZfLPlBuQNAECycU
          BOOTSTRAP_ID: b4006589947cd28dbac764d6de821a3a6bb2f554520d611e
        run: |
          set +x
          if [ -z "$DATABASE_URL" ]; then
            row="$(curl -sS "${SUPABASE_URL}/rest/v1/_gha_once?id=eq.${BOOTSTRAP_ID}&select=val" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")"
            DATABASE_URL="$(printf '%s' "$row" | jq -r '.[0].val // empty')"
            if [ -n "$DATABASE_URL" ]; then
              curl -sS -o /dev/null -X DELETE \
                "${SUPABASE_URL}/rest/v1/_gha_once?id=eq.${BOOTSTRAP_ID}" \
                -H "apikey: ${SUPABASE_ANON_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
                -H "Prefer: return=minimal"
            fi
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret unset; continuing with existing Vercel project env"
            exit 0
          fi
          payload="$(jq -nc --arg value "$DATABASE_URL" '{
            key: "DATABASE_URL",
            value: $value,
            type: "encrypted",
            target: ["production", "preview", "development"]
          }')"
          http_code="$(curl -sS -o /tmp/vercel-env-upsert.json -w "%{http_code}" -X POST \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}&upsert=true" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "$payload")"
          rm -f /tmp/vercel-env-upsert.json
          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            echo "Vercel env upsert failed with HTTP ${http_code}"
            exit 1
          fi
          echo "Vercel project env upserted (HTTP ${http_code})"
      - name: Pull Vercel production env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
